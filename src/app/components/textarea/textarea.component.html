<div class="textarea-wrapper">
  <label *ngIf="label">{{ label }}</label>
  <textarea
    [rows]="rows"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [maxLength]="maxLength"
    [value]="value"
    [class.error]="hasError"
    (input)="handleInput($event)"
    (blur)="onTouched()"
  ></textarea>
  <span class="error-text" *ngIf="hasError">{{ errorText }}</span>
  <span class="char-count" *ngIf="maxLength">{{ value.length }}/{{ maxLength }}</span>
</div>
