<button
  [type]="type"
  [disabled]="disabled || loading"
  [class.secondary]="variant === 'secondary'"
  [class.loading]="loading"
  [style.width]="width"
  [style.float]="float"
  class="app-button"
>
  <span class="spinner" *ngIf="loading"></span>
  <span [class.hidden-label]="loading">{{ label }}</span>
</button>
